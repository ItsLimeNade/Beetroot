x-build: &build
  context: .
  dockerfile: Dockerfile

services:
  bot:
    container_name: beetroot_bot
    build: *build
    image: beetroot:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: sqlite:///app/data/beetroot.db
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - beetroot_data:/app/data
    command: ["bot"]

volumes:
  beetroot_data:
