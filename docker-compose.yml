x-build: &build
  context: .
  dockerfile: Dockerfile

services:
  bot:
    container_name: beetroot_bot
    build: *build
    image: beetroot:latest
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:?set DISCORD_TOKEN}
      ENCRYPTION_SALT: ${ENCRYPTION_SALT:?set ENCRYPTION_SALT}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      FOOD_CLIENT_ID: ${FOOD_CLIENT_ID:-}
      FOOD_CLIENT_SECRET: ${FOOD_CLIENT_SECRET:-}
      EMOJI_SET: ${EMOJI_SET:-prod}
      RUST_LOG: ${RUST_LOG:-info}
      DATABASE_URL: sqlite:///app/data/beetroot.db
      LOG_DIR: /app/data/logs
    volumes:
      - beetroot_data:/app/data

  # Optional web UI for browsing the SQLite database. Opt-in via the "tools"
  # profile, so it never starts during a normal deploy. Bound to localhost
  # only; reach it over an SSH tunnel (see GUIDE.md). It exposes the raw
  # database, so keep it off unless you are actively inspecting data.
  db-viewer:
    image: coleifer/sqlite-web:latest
    container_name: beetroot_db_viewer
    profiles: ["tools"]
    restart: unless-stopped
    environment:
      SQLITE_DATABASE: beetroot.db
    volumes:
      - beetroot_data:/data
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  beetroot_data:
